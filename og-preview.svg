<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Seamless Mask for Photo: Fades smoothly from transparent to solid -->
    <linearGradient id="photoFadeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <mask id="photoFadeMask">
      <rect x="0" y="0" width="600" height="630" fill="url(#photoFadeGrad)"/>
    </mask>

    <!-- Ambient Glow Blurs (No hard edges, pure cinematic lighting) -->
    <filter id="ambientBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- 1. Deep Obsidian Slate Canvas (Zero Outer Container Box) -->
  <rect width="1200" height="630" fill="#060913"/>

  <!-- 2. Ambient Atmosphere Glows -->
  <circle cx="100" cy="120" r="220" fill="#06b6d4" opacity="0.18" filter="url(#ambientBlur)"/>
  <circle cx="360" cy="380" r="240" fill="#6366f1" opacity="0.14" filter="url(#ambientBlur)"/>
  <circle cx="1000" cy="80" r="200" fill="#f59e0b" opacity="0.12" filter="url(#ambientBlur)"/>

  <!-- 3. Seamless Photo Blend on Right Side (NO BOX, NO BORDER) -->
  <g transform="translate(600, 0)" mask="url(#photoFadeMask)">
    <image href="dipta-saha.jpg" x="-60" y="-70" width="660" height="770" preserveAspectRatio="xMidYMid slice"/>
  </g>

  <!-- 4. Left Side Editorial Typography (Zero Boxes) -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">
    <!-- Kicker Line -->
    <circle cx="69" cy="79" r="4" fill="#06b6d4"/>
    <text x="82" y="83" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1.5">SOFTWARE ENGINEER   ·   PORTFOLIO</text>

    <!-- Hero Name -->
    <text x="65" y="172" fill="#ffffff" font-size="62" font-weight="800" letter-spacing="-1">Dipta Saha</text>

    <!-- Primary Title -->
    <text x="65" y="224" fill="#38bdf8" font-size="28" font-weight="700">Software Engineer</text>

    <!-- Key Focus Line -->
    <text x="65" y="262" fill="#c084fc" font-size="19" font-weight="600">Flutter Mobile   ·   Full-Stack Web   ·   Computer Vision AI</text>

    <!-- Editorial Bio Statement -->
    <text x="65" y="306" fill="#94a3b8" font-size="17" font-weight="400">Engineering high-performance cross-platform mobile apps, scalable</text>
    <text x="65" y="332" fill="#94a3b8" font-size="17" font-weight="400">cloud platforms, and real-time computer vision AI systems.</text>

    <!-- Tech Stack (Clean Typography, No Boxes) -->
    <text x="65" y="386" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">CORE TECHNOLOGIES</text>
    <text x="65" y="410" fill="#e2e8f0" font-size="15" font-weight="500">Flutter  •  Dart  •  Next.js  •  Python  •  FastAPI</text>
    <text x="65" y="434" fill="#cbd5e1" font-size="15" font-weight="500">Django  •  Docker  •  PostgreSQL  •  YOLO AI</text>

    <!-- Experience Metric -->
    <text x="65" y="478" fill="#38bdf8" font-size="15" font-weight="600">4+ Years Experience    •    14+ Production Projects</text>

    <!-- Minimal Hairline Divider -->
    <line x1="65" y1="518" x2="595" y2="518" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- Bottom URL & Info -->
    <text x="65" y="548" fill="#f8fafc" font-size="15" font-weight="600">dipta-saha.vercel.app</text>
    <text x="270" y="548" fill="#64748b" font-size="15" font-weight="400">•   github.com/didipta   •   Dhaka, Bangladesh</text>
  </g>
</svg>
